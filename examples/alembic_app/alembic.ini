# What `alembic init` writes, its comments left out. pytest-sqla reads it
# through sqla_alembic_config, alembic.ini next to pytest.ini by default.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# The application's own database: under pytest, pytest-sqla replaces it with
# the database it creates and migrates, and refuses a connection to any other.
sqlalchemy.url = postgresql+psycopg://bookshelf@localhost/bookshelf

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
