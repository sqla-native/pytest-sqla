# A session of its own, because these tests get their schema from Alembic and
# the other examples from create_all. From the repository root:
#
#   pytest examples/alembic_app
[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
filterwarnings = error
addopts = -p no:cacheprovider
# In memory here. CI points it at PostgreSQL and MySQL through PYTEST_SQLA_URL,
# and there sqla_database = run gives the run a database of its own to migrate.
sqla_url = sqlite://
sqla_schema = alembic
sqla_database = run
