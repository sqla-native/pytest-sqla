# This file has to live here, not inside an app directory: `pytest examples`
# picks the first ini file found from examples/ upwards, and one nested deeper
# would lose to the repository's pyproject.toml.
[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
filterwarnings = error
addopts = -p no:cacheprovider
# The committed default. CI points both at PostgreSQL through
# PYTEST_SQLA_URL and PYTEST_SQLA_ASYNC_URL, which take precedence.
sqla_url = sqlite://
sqla_async_url = sqlite+aiosqlite://
