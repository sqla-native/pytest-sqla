name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.0.1"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: OIDC only. There is no API token and no secret to
      # rotate. PyPI must know this repository, workflow and environment as a
      # publisher; before the first release that is a *pending* publisher,
      # registered by hand (GUIDELINES_PYTEST_SQLA.md section 10).
      id-token: write
      contents: read

    # The coverage gate needs the real servers: see the quality job in ci.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sqla
          POSTGRES_PASSWORD: sqla
          POSTGRES_DB: sqla
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U sqla"
          --health-interval=2s --health-timeout=3s --health-retries=30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sqla
          MYSQL_USER: sqla
          MYSQL_PASSWORD: sqla
          MYSQL_ROOT_PASSWORD: sqla
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psqla"
          --health-interval=3s --health-timeout=5s --health-retries=40

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: uv pip install --system -e . --group dev

      # The tag reaches the script through the environment, never pasted into
      # it: a workflow_dispatch input is free text.
      - name: Verify the tag matches the declared version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          PYPROJECT="$(python -c "
          import tomllib
          print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])
          ")"
          DUNDER="$(python -c "
          import re
          src = open('src/pytest_sqla/__init__.py').read()
          print(re.search(r'__version__ = \"([^\"]+)\"', src).group(1))
          ")"
          echo "tag=$TAG pyproject=$PYPROJECT __version__=$DUNDER"
          if [ "$TAG" != "v$PYPROJECT" ]; then
            echo "::error::tag $TAG does not match pyproject version $PYPROJECT"
            exit 1
          fi
          if [ "$PYPROJECT" != "$DUNDER" ]; then
            echo "::error::pyproject version $PYPROJECT does not match __version__ $DUNDER"
            exit 1
          fi

      - name: Run the gates
        env:
          SQLA_TEST_POSTGRES_PSYCOPG_URL: postgresql+psycopg://sqla:sqla@127.0.0.1:5432/sqla
          SQLA_TEST_POSTGRES_ASYNCPG_URL: postgresql+asyncpg://sqla:sqla@127.0.0.1:5432/sqla
          SQLA_TEST_MYSQL_PYMYSQL_URL: mysql+pymysql://sqla:sqla@127.0.0.1:3306/sqla
          SQLA_TEST_MYSQL_AIOMYSQL_URL: mysql+aiomysql://sqla:sqla@127.0.0.1:3306/sqla
          SQLA_TEST_MYSQL_ASYNCMY_URL: mysql+asyncmy://sqla:sqla@127.0.0.1:3306/sqla
          SQLA_TEST_REQUIRE_ALL: "1"
        run: |
          ruff check .
          ruff format --check .
          mypy
          coverage run scripts/check_no_skips.py -q
          coverage report
          complexipy src/pytest_sqla --max-complexity-allowed 15

      - name: Build
        run: |
          python -m build
          twine check --strict dist/*

      - name: Consumer smoke test against the built wheel
        run: python scripts/check_packed_consumer.py

      - name: Audit the production surface
        run: python scripts/audit_production_surface.py

      # The scripts above build their own wheels into dist/. Publish exactly
      # one clean wheel and sdist, built from the tagged tree.
      - name: Rebuild clean distributions
        run: |
          rm -rf dist
          python -m build
          twine check --strict dist/*

      # PEP 740 attestations are generated by default with Trusted Publishing.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
